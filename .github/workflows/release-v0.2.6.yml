name: Release v0.2.6 logging cleanup

on:
  push:
    paths:
      - .github/workflows/release-v0.2.6.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize plugin logging and bump version
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          core_path = Path('mustarrd-dvr-handoff/core.py')
          core = core_path.read_text()

          assert 'version = "0.2.5"' in core
          assert 'logger = logging.getLogger(__name__)\n\nPLUGIN_KEY = "mustarrd-dvr-handoff"' in core
          core = core.replace(
              'logger = logging.getLogger(__name__)\n\nPLUGIN_KEY = "mustarrd-dvr-handoff"',
              '''PLUGIN_NAME = "Mustarrd DVR Handoff"\nPLUGIN_KEY = "mustarrd-dvr-handoff"\n\n\nclass _PluginLogAdapter(logging.LoggerAdapter):\n    """Prefix plugin messages while retaining Dispatcharr's logger namespace."""\n\n    def process(self, msg, kwargs):\n        return f"[{PLUGIN_NAME}] {msg}", kwargs\n\n\ndef _plugin_logger(base_logger=None):\n    if isinstance(base_logger, _PluginLogAdapter):\n        return base_logger\n    return _PluginLogAdapter(\n        base_logger or logging.getLogger("apps.plugins.loader"),\n        {},\n    )\n\n\nlogger = _plugin_logger()''',
              1,
          )

          core = core.replace('    log = task_logger or logger\n', '    log = _plugin_logger(task_logger)\n', 1)
          core = core.replace(
              '        action_logger = context.get("logger") or logger\n',
              '        action_logger = _plugin_logger(context.get("logger"))\n',
              1,
          )
          core = core.replace('    name = "Mustarrd DVR Handoff"\n', '    name = PLUGIN_NAME\n', 1)
          core = core.replace('    version = "0.2.5"\n', '    version = "0.2.6"\n', 1)

          old_mirror = '''                result["mirrored"] += 1\n                result["details"].append('''
          new_mirror = '''                result["mirrored"] += 1\n                log.info(\n                    "Mirrored recording %s to Mustarrd schedule %s (%s / %s)",\n                    recording.id,\n                    verified_schedule.get("id"),\n                    channel.name,\n                    program.get("title"),\n                )\n                result["details"].append('''
          assert old_mirror in core
          core = core.replace(old_mirror, new_mirror, 1)

          core = core.replace(
              '                "Mustarrd handoff: Dispatcharr recording %s -> Mustarrd schedule %s "\n',
              '                "Handed off recording %s to Mustarrd schedule %s "\n',
              1,
          )

          old_return = '''    finally:\n        client.close()\n\n    return result\n\n\nclass Plugin:'''
          new_return = '''    finally:\n        client.close()\n\n    if result["considered"]:\n        log.info(\n            "Handoff check complete: considered=%s, mirrored=%s, "\n            "already_mirrored=%s, handed_off=%s, skipped=%s, errors=%s%s",\n            result["considered"],\n            result["mirrored"],\n            result["already_mirrored"],\n            result["handed_off"],\n            result["skipped"],\n            result["errors"],\n            " (dry run)" if dry_run else "",\n        )\n\n    return result\n\n\nclass Plugin:'''
          assert old_return in core
          core = core.replace(old_return, new_return, 1)

          old_conn = '''                active_schedules = [\n                    schedule\n                    for schedule in schedules\n                    if str(schedule.get("status") or "").strip().lower()\n                    in ACTIVE_MUSTARRD_STATUSES\n                ]\n                return {'''
          new_conn = '''                active_schedules = [\n                    schedule\n                    for schedule in schedules\n                    if str(schedule.get("status") or "").strip().lower()\n                    in ACTIVE_MUSTARRD_STATUSES\n                ]\n                action_logger.info(\n                    "Connection test successful: %s active schedule(s)",\n                    len(active_schedules),\n                )\n                return {'''
          assert old_conn in core
          core = core.replace(old_conn, new_conn, 1)

          old_conn_exc = '''            except Exception as exc:\n                return {"status": "error", "message": str(exc)}\n            finally:\n                client.close()'''
          new_conn_exc = '''            except Exception as exc:\n                action_logger.warning("Connection test failed: %s", exc)\n                return {"status": "error", "message": str(exc)}\n            finally:\n                client.close()'''
          assert old_conn_exc in core
          core = core.replace(old_conn_exc, new_conn_exc, 1)

          core = core.replace(
              '        action_logger.info("%s Mustarrd handoff cron: %s", verb, cron_expr)\n',
              '        action_logger.info("%s handoff cron schedule: %s", verb, cron_expr)\n',
              1,
          )

          old_remove = '''                deleted, _ = PeriodicTask.objects.filter(\n                    name=self.SCHEDULE_TASK_NAME\n                ).delete()\n                return {'''
          new_remove = '''                deleted, _ = PeriodicTask.objects.filter(\n                    name=self.SCHEDULE_TASK_NAME\n                ).delete()\n                if deleted:\n                    action_logger.info("Removed handoff cron schedule")\n                return {'''
          assert old_remove in core
          core = core.replace(old_remove, new_remove, 1)

          core_path.write_text(core)

          plugin_path = Path('mustarrd-dvr-handoff/plugin.py')
          plugin = plugin_path.read_text()
          assert '_core.Plugin.version = "0.2.5"' in plugin
          plugin = plugin.replace('# v0.2.5 defaults.', '# v0.2.6 defaults.', 1)
          plugin = plugin.replace('_core.Plugin.version = "0.2.5"', '_core.Plugin.version = "0.2.6"', 1)
          plugin_path.write_text(plugin)

          manifest_path = Path('mustarrd-dvr-handoff/plugin.json')
          manifest = manifest_path.read_text()
          assert '"version": "0.2.5"' in manifest
          manifest = manifest.replace('"version": "0.2.5"', '"version": "0.2.6"', 1)
          manifest_path.write_text(manifest)

          with manifest_path.open() as f:
              data = json.load(f)
          assert data['version'] == '0.2.6'

          final_core = core_path.read_text()
          assert 'logging.getLogger("apps.plugins.loader")' in final_core
          assert 'logging.getLogger(__name__)' not in final_core
          assert 'return f"[{PLUGIN_NAME}] {msg}"' in final_core
          assert 'log = _plugin_logger(task_logger)' in final_core
          assert 'action_logger = _plugin_logger(context.get("logger"))' in final_core
          assert '"queue": "celery"' in final_core
          assert 'Handoff check complete:' in final_core
          assert 'Mirrored recording %s to Mustarrd schedule %s' in final_core
          assert 'Handed off recording %s to Mustarrd schedule %s' in final_core
          PY

      - name: Compile and validate manifest
        run: |
          python -m json.tool mustarrd-dvr-handoff/plugin.json >/dev/null
          python -m py_compile mustarrd-dvr-handoff/core.py mustarrd-dvr-handoff/plugin.py

      - name: Commit validated release source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-v0.2.6.yml
          git add mustarrd-dvr-handoff/core.py mustarrd-dvr-handoff/plugin.py mustarrd-dvr-handoff/plugin.json
          git commit -m "Normalize plugin logging for v0.2.6"
          git push
